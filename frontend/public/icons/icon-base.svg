<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#3b82f6"/>
  
  <!-- Travel icon - simplified airplane and location pin -->
  <g transform="translate(256, 256)">
    <!-- Airplane -->
    <path d="M-60 -40 L-20 -20 L40 -60 L60 -40 L20 -20 L60 20 L40 40 L-20 0 L-60 20 L-80 0 Z" fill="white" opacity="0.9"/>
    
    <!-- Location pin -->
    <circle cx="40" cy="60" r="30" fill="white"/>
    <circle cx="40" cy="50" r="15" fill="#3b82f6"/>
    
    <!-- Route line -->
    <path d="M-40 -20 Q0 20 40 50" stroke="white" stroke-width="4" fill="none" opacity="0.7"/>
  </g>
  
  <!-- App name -->
  <text x="256" y="420" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">Journo</text>
</svg>